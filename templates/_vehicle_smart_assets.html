<!-- Skupni viri za pametna polja vozila (skener + skripte). Vključi pred init. -->
<div class="modal fade" id="scanModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="scan-title"><i class="bi bi-upc-scan me-1"></i>Skeniraj VIN</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="VehicleSmart.stopCam()"></button>
      </div>
      <div class="modal-body text-center">
        <div style="position:relative; background:#000; border-radius:8px; overflow:hidden;">
          <video id="scan-video" playsinline muted
                 style="width:100%; max-height:62vh; display:block;"></video>

          <!-- Vodilo za poravnavo VIN -->
          <div style="position:absolute; top:50%; left:6%; right:6%; height:22%; transform:translateY(-50%);
                      border:2px solid rgba(59,130,246,.95); border-radius:6px;
                      box-shadow:0 0 0 9999px rgba(0,0,0,.38); pointer-events:none;">
            <span style="position:absolute; top:-22px; left:0; color:#93c5fd; font-size:11px;
                         font-weight:600; letter-spacing:.04em;">VIN naj zapolni okvir</span>
          </div>

          <!-- Svetilka (če jo naprava podpira) -->
          <button type="button" id="scan-torch" class="btn btn-sm scan-torch-btn"
                  style="display:none" onclick="VehicleSmart.toggleTorch()" title="Svetilka">
            <i class="bi bi-lightning-charge-fill"></i>
          </button>
        </div>

        <canvas id="scan-canvas" style="display:none;"></canvas>

        <!-- Približevanje (če ga naprava podpira) -->
        <div id="scan-zoom-wrap" class="d-flex align-items-center gap-2 mt-2" style="display:none !important;">
          <i class="bi bi-zoom-out text-muted small"></i>
          <input type="range" id="scan-zoom" class="form-range flex-grow-1">
          <i class="bi bi-zoom-in text-muted small"></i>
        </div>

        <p id="scan-msg" class="small text-muted mt-2 mb-0">Poravnaj VIN v okvir…</p>

        <div class="small text-muted mt-2" style="line-height:1.45">
          <i class="bi bi-info-circle me-1"></i>
          Če je na tablici <b>črtna koda</b>, jo preberem sam – samo usmeri kamero vanjo.
          Pri bleščanju pomaga <b>rahel kot</b> in prižgana svetilka.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="scan-capture" class="btn btn-primary" onclick="VehicleSmart.captureOCR()">
          <i class="bi bi-camera me-1"></i>Zajemi VIN
        </button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" onclick="VehicleSmart.stopCam()">Prekliči</button>
      </div>
    </div>
  </div>
</div>

<style>
  .scan-torch-btn {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.3);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .scan-torch-btn:hover { background: rgba(255,255,255,.26); color: #fff; }
  .scan-torch-btn.active { background: #facc15; color: #1f2937; border-color: #facc15; }
</style>

<script>window.CAR_MAKES = {{ car_makes | tojson }};</script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="{{ url_for('static', filename='js/vehicle_smart.js') }}"></script>
